  <style>
    /* Global Loader para evitar FOUC */
    #global-loader {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #0b0b0b;
      z-index: 999999;
      display: flex; justify-content: center; align-items: center;
      transition: opacity 0.6s ease;
    }
    .loader-logo { width: 120px; height: auto; animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.5; } }
  </style>

  <div id="global-loader">
    <img src="/logo.png" alt="Cargando Elixir Gym..." class="loader-logo">
  </div>

  <script>
    // Remover el loader una vez que todos los estilos e imágenes hayan cargado
    window.addEventListener('load', function() {
      var loader = document.getElementById('global-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.style.display = 'none'; }, 600);
      }
    });
  </script>
