<section class="pt-32 pb-24 px-margin-mobile md:px-margin-desktop bg-background min-h-screen">
  <div class="max-w-7xl mx-auto">
    <div class="text-center mb-16">
      <h1 class="font-headline-xl text-5xl md:text-6xl text-on-surface uppercase italic font-black mb-6">ELIXIR <span class="text-gradient">BLOG</span></h1>
      <p class="text-on-surface-variant font-body-lg max-w-2xl mx-auto">Artículos, consejos y noticias de alto rendimiento desde el corazón de Temuco.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <article *ngFor="let post of posts" class="bg-surface border border-white/5 rounded-xl overflow-hidden hover:border-primary-container/50 transition-all duration-300 group flex flex-col h-full cursor-pointer" [routerLink]="['/blog', post.slug]">
        <div class="h-64 overflow-hidden relative">
          <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-all z-10"></div>
          <img [src]="post.imageUrl" [alt]="post.title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        </div>
        <div class="p-8 flex-1 flex flex-col">
          <div class="flex items-center gap-4 text-[10px] uppercase tracking-widest text-primary-container font-bold mb-4">
            <span>{{post.date}}</span>
            <span class="w-1 h-1 bg-white/20 rounded-full"></span>
            <span>{{post.author}}</span>
          </div>
          <h2 class="text-2xl font-black text-white italic uppercase mb-4 leading-tight group-hover:text-primary-container transition-colors">{{post.title}}</h2>
          <p class="text-on-surface-variant font-body-md line-clamp-3 flex-1">{{post.summary}}</p>
          <div class="mt-6 flex items-center gap-2 text-white font-label-bold text-xs uppercase tracking-widest">
            LEER ARTÍCULO <span class="material-symbols-outlined text-sm">arrow_forward</span>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
