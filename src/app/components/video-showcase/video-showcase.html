<section class="py-24 bg-surface-container-lowest relative" id="tour">
  <div class="px-margin-mobile md:px-margin-desktop max-w-7xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-16 max-w-3xl mx-auto">
      <h2 class="font-display-lg-mobile md:font-display-lg text-4xl md:text-5xl font-black italic uppercase text-on-surface mb-4">
        CONOCE NUESTRAS <span class="text-primary-container">INSTALACIONES</span>
      </h2>
      <p class="text-on-surface-variant text-lg tracking-wide">
        Descubre el ambiente, equipamiento y la energía que se vive a diario en Elixir Gym.
      </p>
    </div>

    <!-- Bento Grid Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Columna Izquierda: Video Destacado -->
      <div class="lg:col-span-7 flex flex-col relative group">
        <div class="w-full aspect-video rounded-2xl overflow-hidden border border-white/10 shadow-2xl bg-black relative">
          <video class="w-full h-full object-cover" controls preload="metadata" poster="/assets/images/fondo-hero-principal.jpg">
            <source src="/assets/video-instalaciones.mp4" type="video/mp4">
            Tu navegador no soporta videos HTML5.
          </video>
        </div>
        <div class="mt-4 flex items-center justify-between">
          <p class="text-primary-container font-label-bold text-sm uppercase tracking-widest flex items-center gap-2">
            <span class="material-symbols-outlined text-base">play_circle</span>
            Video de la Semana
          </p>
          <p class="text-on-surface-variant/50 text-xs italic">Sube el volumen 🔊</p>
        </div>
      </div>

      <!-- Columna Derecha: Mosaico de Galería -->
      <div class="lg:col-span-5 grid grid-cols-2 gap-4 h-full">
        <div *ngFor="let img of images; let i = index" 
             class="relative group overflow-hidden rounded-xl border border-white/5 cursor-pointer bg-surface-container-low"
             [ngClass]="i === 0 || i === 3 ? 'aspect-[4/5]' : 'aspect-square'">
             
          <img [src]="img.src" [alt]="img.alt" loading="lazy" 
               class="w-full h-full object-cover transition-all duration-700 ease-in-out group-hover:scale-110 saturate-[1.1] contrast-[1.1] group-hover:saturate-125">
               
          <!-- Overlay Degradado -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-80 group-hover:opacity-100 transition-opacity duration-300"></div>
          
          <!-- Texto del área -->
          <div class="absolute bottom-0 left-0 w-full p-4 transform translate-y-2 group-hover:translate-y-0 transition-transform duration-300">
            <p class="text-white font-headline-md italic font-black uppercase text-sm md:text-base leading-tight">
              {{ img.alt }}
            </p>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
