<section #statsSection class="py-16 px-margin-mobile md:px-margin-desktop bg-primary-container relative overflow-hidden" id="stats">
  <!-- Decorative background -->
  <div class="absolute inset-0 opacity-10">
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-white rounded-full mix-blend-overlay filter blur-3xl"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-white rounded-full mix-blend-overlay filter blur-3xl"></div>
  </div>
  
  <div class="max-w-7xl mx-auto relative z-10">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-8 text-center">
      <div *ngFor="let stat of stats" class="p-4">
        <div class="font-display-lg-mobile md:font-display-lg text-4xl md:text-5xl text-white font-black italic mb-2 tracking-tighter">
          {{ stat.prefix }}{{ animatedValues[stat.id] }}{{ stat.suffix }}
        </div>
        <div class="font-label-bold text-[10px] md:text-xs text-on-primary-container uppercase tracking-[0.2em] font-bold">
          {{ stat.label }}
        </div>
      </div>
    </div>
  </div>
</section>
