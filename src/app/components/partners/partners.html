<section class="py-24 px-margin-mobile md:px-margin-desktop bg-surface-container-high relative overflow-hidden shadow-[inset_0_20px_50px_rgba(0,0,0,0.5)]" id="convenios">
  
  <!-- Background Glows -->
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute -top-32 left-1/4 w-96 h-96 bg-primary/10 blur-[100px] rounded-full mix-blend-screen"></div>
    <div class="absolute -bottom-32 right-1/4 w-96 h-96 bg-electric-blue/5 blur-[100px] rounded-full mix-blend-screen"></div>
  </div>
  
  <div class="max-w-7xl mx-auto text-center mb-16 relative z-10">
    <div class="inline-flex items-center gap-3 py-2 px-5 bg-white/5 border border-white/10 backdrop-blur-md text-primary font-label-bold text-[10px] uppercase tracking-[0.3em] rounded-full shadow-[0_0_15px_rgba(2,132,199,0.2)] mb-8">
      <span class="material-symbols-outlined text-sm">handshake</span>
      ALIANZAS CORPORATIVAS
    </div>
    
    <h2 class="font-headline-xl text-4xl md:text-5xl text-white uppercase leading-[1.1] italic font-black drop-shadow-lg">
      EMPRESAS CON <span class="text-gradient">CONVENIO</span>
    </h2>
    <p class="font-body-lg text-on-surface-variant mt-6 max-w-2xl mx-auto leading-relaxed">
      Colaboradores y afiliados de estas instituciones acceden a beneficios exclusivos y tarifas preferenciales en nuestro centro de alto rendimiento.
    </p>
  </div>

  <!-- Logo marquee without box -->
  <div class="relative max-w-[100vw] mx-auto py-10">
    <app-logo-loop
      [logos]="logos"
      [speed]="40"
      [gap]="80"
      [logoHeight]="90"
      [fadeOut]="false"
      ariaLabel="Empresas con convenio">
    </app-logo-loop>
  </div>
</section>
