<!-- Mini Widget Flotante (Se muestra cuando el modal se cierra) -->
<div class="fixed bottom-[100px] right-5 md:right-7 z-[250] transition-all duration-700 ease-in-out"
     [ngClass]="isMiniFloating ? 'opacity-100 translate-y-0 pointer-events-auto scale-100' : 'opacity-0 translate-y-12 pointer-events-none scale-50'">
  <button (click)="reopenModal()" aria-label="Abrir Promoción"
          class="relative group text-primary hover:text-white flex items-center justify-center transition-all duration-300">
    <!-- Pulso sutil detrás del icono -->
    <div class="absolute inset-0 bg-primary/30 rounded-full animate-ping scale-75"></div>
    <!-- Solo el Icono (Más chico que WhatsApp) -->
    <i class="bi bi-gift-fill text-2xl md:text-3xl drop-shadow-[0_0_15px_rgba(255,140,0,0.9)] relative z-10 group-hover:scale-110 group-hover:rotate-12 transition-transform duration-300"></i>
    
    <!-- Tooltip -->
    <span class="absolute right-full mr-4 top-1/2 -translate-y-1/2 bg-black/80 backdrop-blur-sm border border-white/10 text-white text-[10px] uppercase font-bold px-3 py-1.5 rounded-lg whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
      Tu Día Gratis
    </span>
  </button>
</div>

<!-- Modal Principal -->
<div class="fixed inset-0 z-[300] flex items-center justify-center p-4 transition-all duration-500"
     [ngClass]="isModalOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none delay-300'">
  
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/80 backdrop-blur-md" (click)="closeModal()"></div>
  
  <!-- Modal Card con Efecto Gota (Teardrop) al cerrar -->
  <div class="relative w-full max-w-lg bg-surface-container-high border border-primary/30 overflow-hidden shadow-[0_30px_60px_-15px_rgba(255,69,0,0.3)] flex flex-col transform origin-bottom-right transition-all duration-[800ms] ease-in-out"
       [ngClass]="isModalOpen ? 'translate-y-0 translate-x-0 scale-100 rounded-3xl opacity-100' : 'translate-y-[45vh] translate-x-[45vw] scale-0 rounded-[100%_100%_0%_100%] opacity-0'">
    
    <!-- Header Image with Background Image -->
    <div class="relative h-64 flex flex-col items-center justify-center overflow-hidden">
      <!-- Background Image -->
      <img src="/promo-bg.jpg" alt="Promo Elixir Gym" class="absolute inset-0 w-full h-full object-cover filter brightness-75">
      <!-- Glow effect overlay -->
      <div class="absolute inset-0 bg-gradient-to-t from-surface-container-high via-black/40 to-black/20"></div>
      
      <i class="bi bi-lightning-charge-fill text-7xl text-primary drop-shadow-[0_0_20px_rgba(255,140,0,0.9)] relative z-10 animate-pulse mb-4"></i>
      
      <!-- Ticker banner effect -->
      <div class="absolute bottom-0 w-full bg-black/60 backdrop-blur-sm py-1.5 text-center border-t border-primary/30">
         <span class="text-white font-label-bold text-[9px] uppercase tracking-[0.3em]">Solo 10 Cupos Semanales</span>
      </div>
    </div>
    
    <!-- Close button -->
    <button (click)="closeModal()" aria-label="Cerrar promoción"
            class="absolute top-4 right-4 z-30 w-8 h-8 bg-black/60 hover:bg-primary border border-white/20 text-white rounded-full flex items-center justify-center backdrop-blur-md transition-colors">
      <i class="bi bi-x text-lg"></i>
    </button>
    
    <!-- Content -->
    <div class="p-8 text-center flex flex-col gap-4">
      <h3 class="font-headline-md text-3xl md:text-4xl text-white uppercase font-black leading-tight drop-shadow-md">
        Desbloquea <br><span class="text-gradient pr-2">1 Día Gratis</span>
      </h3>
      
      <p class="font-body-md text-sm md:text-base text-on-surface-variant/90 leading-relaxed max-w-[90%] mx-auto">
        Regalamos <strong class="text-white font-bold">10 pases diarios gratis</strong> cada semana a nuevos miembros. ¡Asegura el tuyo antes de que se acaben y vive la experiencia Elixir!
      </p>
      
      <!-- CTA Button -->
      <a href="https://wa.me/56991832903?text=Hola!%20Quiero%20reclamar%20mi%20pase%20diario%20gratis%20que%20vi%20en%20la%20web" 
         target="_blank" rel="noopener" (click)="closeModal()"
         class="mt-4 relative overflow-hidden group w-full flex items-center justify-center gap-3 bg-transparent border-2 border-primary text-primary hover:text-black font-black text-xs uppercase px-8 py-4 rounded-xl tracking-[0.2em] transition-all duration-300 shadow-[0_0_20px_rgba(255,140,0,0.15)] hover:shadow-[0_0_40px_rgba(255,140,0,0.4)]">
        <span class="relative z-10 flex items-center justify-center gap-2">
          <i class="bi bi-ticket-perforated-fill text-lg"></i>
          ¡QUIERO MI DÍA GRATIS!
        </span>
        <div class="absolute inset-0 bg-primary transform -translate-x-full group-hover:translate-x-0 transition-transform duration-300 ease-out z-0"></div>
      </a>
      
      <button (click)="closeModal()" class="mt-2 text-[10px] text-on-surface-variant/50 hover:text-white uppercase tracking-widest font-label-bold transition-colors">
        Quizás más tarde
      </button>
    </div>
    
  </div>
</div>
