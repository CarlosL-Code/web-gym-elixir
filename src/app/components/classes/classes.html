<section class="py-24 px-margin-mobile md:px-margin-desktop bg-surface relative overflow-hidden" id="classes">
  <!-- Glowing Backgrounds -->
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-primary/10 blur-[150px] rounded-full mix-blend-screen"></div>
  </div>

  <div class="max-w-7xl mx-auto relative z-10">
    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-end mb-16 gap-8">
      <div class="max-w-xl">
        <div class="inline-flex items-center gap-3 mb-6 py-2 px-5 bg-white/5 border border-white/10 backdrop-blur-md text-primary font-label-bold text-[10px] uppercase tracking-[0.3em] rounded-full shadow-[0_0_15px_rgba(2,132,199,0.2)]">
          <span class="material-symbols-outlined text-sm">fitness_center</span>
          NUESTRAS ÁREAS
        </div>
        <h2 class="font-headline-xl text-4xl md:text-5xl text-white uppercase font-black mb-4 drop-shadow-lg leading-tight">SERVICIOS <span class="text-gradient pr-2">ELIXIR</span></h2>
        <p class="text-on-surface-variant font-body-lg leading-relaxed">Infraestructura de primer nivel diseñada para maximizar cada minuto de tu entrenamiento y potenciar tus resultados.</p>
      </div>
      
      <!-- Glass Horario -->
      <div class="flex flex-col sm:flex-row gap-3 bg-white/5 backdrop-blur-md border border-white/10 p-2.5 rounded-3xl shadow-xl w-full lg:w-auto">
        <div class="flex items-center justify-center gap-2 bg-gradient-to-r from-primary to-electric-blue text-black px-6 py-4 rounded-2xl font-black text-[10px] uppercase tracking-[0.2em]" style="box-shadow: 0 0 15px var(--color-primary-container);">
          <i class="bi bi-calendar-event text-sm"></i>
          LUNES A VIERNES: 06:30 - 22:00
        </div>
        <div class="flex items-center justify-center gap-2 bg-white/10 text-white px-6 py-4 rounded-2xl font-label-bold text-[10px] uppercase tracking-[0.2em] border border-white/20 shadow-sm hover:bg-white/20 transition-colors">
          <i class="bi bi-calendar-check text-sm text-primary"></i>
          SÁBADO: 09:30 - 15:00
        </div>
      </div>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 lg:gap-8">
      <!-- Tarjetas Glassmorphism -->
      <div *ngFor="let gymClass of classes" class="group bg-gradient-to-b from-white/5 to-white/[0.02] backdrop-blur-lg border border-white/10 p-10 rounded-[2rem] relative overflow-hidden transition-all duration-500 hover:border-primary/50 hover:shadow-[0_20px_40px_-15px_rgba(2,132,199,0.3)] hover:-translate-y-2">
        
        <!-- Luz interactiva interna -->
        <div class="absolute -top-32 -right-32 w-64 h-64 bg-primary/20 rounded-full blur-[80px] opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-electric-blue transform scale-x-0 group-hover:scale-x-100 transition-transform duration-500 origin-left"></div>

        <div class="relative w-16 h-16 mb-8 flex items-center justify-center">
          <div class="absolute inset-0 bg-primary/20 rounded-2xl blur-md opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
          <span class="material-symbols-outlined text-primary text-5xl relative z-10 group-hover:scale-110 group-hover:text-white transition-all duration-500 drop-shadow-[0_0_10px_rgba(2,132,199,0.5)]">{{ gymClass.icon }}</span>
        </div>
        
        <h3 class="font-headline-md text-xl text-white mb-4 uppercase tracking-widest font-bold group-hover:text-transparent group-hover:bg-clip-text group-hover:bg-gradient-to-r group-hover:from-white group-hover:to-primary transition-colors duration-500">{{ gymClass.name }}</h3>
        
        <p class="font-body-md text-sm text-on-surface-variant/80 leading-relaxed group-hover:text-white/90 transition-colors duration-500 relative z-10">{{ gymClass.description }}</p>
      </div>
    </div>
  </div>
</section>
