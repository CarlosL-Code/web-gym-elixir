        <button (click)="setTheme('theme-blue')" [class.border-2]="activeTheme === 'theme-blue'" [class.border-white]="activeTheme === 'theme-blue'" class="w-4 h-4 rounded-full bg-gradient-to-br from-cyan-400 to-blue-600 hover:scale-110 transition-transform shadow-sm" title="Tema Azul"></button>
