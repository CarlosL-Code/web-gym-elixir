<section class="py-xl px-margin-mobile md:px-margin-desktop bg-surface-container-lowest" id="faq">
  <div class="max-w-4xl mx-auto">
    <div class="text-center mb-16">
      <h2 class="font-headline-xl text-3xl md:text-5xl text-on-surface uppercase italic font-black">PREGUNTAS <span class="text-gradient">FRECUENTES</span></h2>
      <p class="text-on-surface-variant uppercase tracking-[0.4em] font-label-bold text-[10px] mt-4">Todo lo que necesitas saber</p>
    </div>
    
    <div class="space-y-4">
      <div *ngFor="let item of faqs; let i = index" class="border border-white/10 bg-surface rounded-lg overflow-hidden transition-all duration-300">
        <button (click)="toggle(i)" class="w-full px-6 py-5 flex justify-between items-center text-left hover:bg-white/5 transition-colors focus:outline-none">
          <span class="font-label-bold text-sm uppercase tracking-widest text-on-surface pr-8" [class.text-primary-container]="openIndex === i">{{ item.question }}</span>
          <span class="material-symbols-outlined text-primary-container transition-transform duration-300" [class.rotate-180]="openIndex === i">
            expand_more
          </span>
        </button>
        
        <div class="overflow-hidden transition-all duration-300 ease-in-out" 
             [style.maxHeight]="openIndex === i ? '300px' : '0px'" 
             [style.opacity]="openIndex === i ? '1' : '0'">
          <div class="p-6 pt-0 text-on-surface-variant text-sm leading-relaxed border-t border-white/5">
            {{ item.answer }}
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
