<section class="py-24 px-margin-mobile md:px-margin-desktop bg-surface relative overflow-hidden" id="faq">
  <div class="max-w-7xl mx-auto">
    
    <div class="flex flex-col lg:flex-row gap-12 lg:gap-16 items-center">
      
      <!-- Columna Izquierda: Imagen -->
      <div class="w-full lg:w-1/2 relative group">
        <!-- Resplandor Metálico -->
        <div class="absolute inset-0 bg-primary/20 blur-[80px] rounded-full group-hover:bg-primary/40 transition-colors duration-700 pointer-events-none"></div>
        
        <!-- Contenedor Imagen -->
        <div class="relative w-full h-[400px] lg:h-[700px] rounded-[2.5rem] overflow-hidden border border-white/10 shadow-[0_0_50px_rgba(2,132,199,0.15)] group-hover:shadow-[0_0_50px_rgba(2,132,199,0.3)] transition-all duration-500">
          <img src="assets/faq-image.jpg" alt="Equipamiento Gimnasio" loading="lazy" class="w-full h-full object-cover transition-transform duration-[2000ms] group-hover:scale-105 filter brightness-90 group-hover:brightness-100 saturate-110">
          
          <!-- Overlay de gradiente para fusionarse con el fondo -->
          <div class="absolute inset-0 bg-gradient-to-t from-surface via-transparent to-transparent opacity-80 lg:bg-gradient-to-r lg:from-transparent lg:to-surface pointer-events-none"></div>
        </div>
      </div>
      
      <!-- Columna Derecha: Contenido FAQ -->
      <div class="w-full lg:w-1/2">
        
        <div class="text-left mb-12">
          <h2 class="font-headline-xl text-4xl md:text-5xl text-on-surface uppercase italic font-black">PREGUNTAS <span class="text-gradient">FRECUENTES</span></h2>
          <p class="text-on-surface-variant uppercase tracking-[0.4em] font-label-bold text-[10px] mt-4 flex items-center gap-3">
            <span class="w-12 h-[2px] bg-primary"></span>
            Todo lo que necesitas saber
          </p>
        </div>
        
        <!-- Acordeón FAQ -->
        <div class="space-y-4">
          <div *ngFor="let item of faqs; let i = index" 
               class="bg-surface-container-low/50 backdrop-blur-md rounded-2xl overflow-hidden transition-all duration-300 border border-white/5"
               [ngClass]="openIndex === i ? 'border-primary/50 shadow-[0_10px_30px_rgba(2,132,199,0.15)] bg-surface-container-high/80' : 'hover:border-white/20 hover:bg-surface-container-low'">
            
            <button (click)="toggle(i)" class="w-full px-6 py-6 flex justify-between items-center text-left transition-colors focus:outline-none group">
              <span class="font-label-bold text-xs md:text-sm uppercase tracking-widest text-on-surface pr-8 transition-colors duration-300" 
                    [class.text-primary]="openIndex === i" 
                    [class.group-hover:text-primary]="openIndex !== i">
                {{ item.question }}
              </span>
              <div class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center transition-all duration-300 shrink-0 bg-white/5" 
                   [ngClass]="openIndex === i ? 'bg-primary border-primary text-black rotate-180' : 'group-hover:bg-primary/20 text-white'">
                <span class="material-symbols-outlined text-sm">
                  expand_more
                </span>
              </div>
            </button>
            
            <div class="overflow-hidden transition-all duration-500 ease-[cubic-bezier(0.25,1,0.5,1)]" 
                 [style.maxHeight]="openIndex === i ? '500px' : '0px'" 
                 [style.opacity]="openIndex === i ? '1' : '0'">
              <div class="px-6 pb-6 pt-2 text-on-surface-variant text-sm leading-relaxed border-t border-white/5 mt-2">
                {{ item.answer }}
              </div>
            </div>
          </div>
        </div>
        
      </div>
      
    </div>
  </div>
</section>
