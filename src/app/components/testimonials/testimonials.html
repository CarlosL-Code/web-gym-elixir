<section class="py-xl px-margin-mobile md:px-margin-desktop bg-gradient-to-b from-surface-container-lowest to-surface" id="testimonials">
  <div class="max-w-7xl mx-auto">
    <div class="text-center mb-16">
      <h2 class="font-headline-xl text-4xl md:text-5xl text-on-surface uppercase italic font-black">LO QUE DICEN <br class="md:hidden"><span class="text-gradient">NUESTROS SOCIOS</span></h2>
      <p class="text-on-surface-variant uppercase tracking-[0.4em] font-label-bold text-[10px] mt-4">Comunidad Elixir Gym</p>
    </div>
    
    <!-- Carousel Container -->
    <div class="relative max-w-5xl mx-auto mt-8 md:mt-16 mb-20 px-4 md:px-12">
      
      <!-- Grid overlapping container -->
      <div class="grid w-full">
        <ng-container *ngFor="let t of testimonials; let i = index">
          
          <div style="grid-area: 1 / 1;" 
               class="transition-all duration-1000 ease-in-out flex flex-col md:flex-row gap-8 md:gap-16 items-center bg-gradient-to-br from-surface-container-high/50 to-surface-container-lowest/80 backdrop-blur-xl border border-white/10 p-8 md:p-14 rounded-[2rem] shadow-2xl"
               [class.opacity-100]="i === currentIndex"
               [class.z-10]="i === currentIndex"
               [class.translate-y-0]="i === currentIndex"
               [class.scale-100]="i === currentIndex"
               [class.opacity-0]="i !== currentIndex"
               [class.z-0]="i !== currentIndex"
               [class.translate-y-4]="i !== currentIndex"
               [class.scale-95]="i !== currentIndex"
               [class.pointer-events-none]="i !== currentIndex">
               
            <!-- Left Side: Profile -->
            <div class="w-full md:w-1/3 flex flex-col items-center md:items-start text-center md:text-left shrink-0">
              <div class="relative mb-6">
                <div class="absolute inset-0 bg-primary/30 rounded-full blur-xl"></div>
                <img [src]="t.avatar" alt="" class="relative w-24 h-24 md:w-32 md:h-32 rounded-full object-cover border-4 border-primary shadow-[0_0_30px_rgba(2,132,199,0.5)]">
              </div>
              
              <h4 class="font-headline-md text-xl text-white uppercase tracking-wider mb-1">{{ t.name }}</h4>
              <p class="font-label-bold text-xs text-primary uppercase tracking-[0.2em] mb-4">{{ t.timeClient }}</p>
              
              <div class="flex gap-1 justify-center md:justify-start">
                <span *ngFor="let star of stars" class="material-symbols-outlined text-primary text-xl shadow-primary/50 drop-shadow-md" [class.opacity-30]="star > t.rating">star</span>
              </div>
            </div>
            
            <!-- Right Side: Quote -->
            <div class="w-full md:w-2/3 relative pt-4 md:pt-0">
              <!-- Giant minimal quote mark -->
              <div class="absolute -top-10 -left-6 md:-top-16 md:-left-12 text-primary/10 select-none pointer-events-none">
                <span class="font-display-lg text-[120px] md:text-[150px] leading-none">"</span>
              </div>
              
              <p class="font-body-md text-lg md:text-2xl text-on-surface leading-relaxed relative z-10 italic">
                {{ t.comment }}
              </p>
            </div>
          </div>
        </ng-container>
      </div>

      <!-- Navigation Buttons -->
      <button (click)="prevTestimonial()" class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-4 md:-translate-x-12 w-12 h-12 flex items-center justify-center bg-surface-container-high/80 hover:bg-primary border border-white/10 rounded-full text-white transition-colors z-20 shadow-xl backdrop-blur-sm cursor-pointer">
        <span class="material-symbols-outlined">chevron_left</span>
      </button>
      
      <button (click)="nextTestimonial()" class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-4 md:translate-x-12 w-12 h-12 flex items-center justify-center bg-surface-container-high/80 hover:bg-primary border border-white/10 rounded-full text-white transition-colors z-20 shadow-xl backdrop-blur-sm cursor-pointer">
        <span class="material-symbols-outlined">chevron_right</span>
      </button>

      <!-- Indicators -->
      <div class="flex justify-center gap-3 absolute -bottom-12 left-0 right-0 z-20">
        <button *ngFor="let t of testimonials; let i = index" 
                (click)="setTestimonial(i)"
                class="h-1.5 rounded-full transition-all duration-300 cursor-pointer"
                [class.w-8]="i === currentIndex"
                [class.bg-primary]="i === currentIndex"
                [class.w-2]="i !== currentIndex"
                [class.bg-white/20]="i !== currentIndex">
        </button>
      </div>
    </div>

    <div class="mt-12 flex flex-col sm:flex-row justify-center items-center gap-4">
      <button type="button" (click)="openReviewModal($event)" class="bg-transparent border border-white/20 text-white font-label-bold text-xs uppercase px-12 py-4 rounded-none tracking-[0.2em] backdrop-blur-sm hover:bg-white hover:text-black transition-all inline-block text-center w-full sm:w-auto cursor-pointer">
        DEJAR UNA RESEÑA
      </button>
      <a href="https://wa.me/56991832903" target="_blank" class="bg-primary-container text-white font-label-bold text-xs uppercase px-12 py-4 rounded-none tracking-[0.2em] hover:bg-white hover:text-black transition-all inline-block text-center w-full sm:w-auto">
        QUIERO COMENZAR
      </a>
    </div>
  </div>

  <!-- Review Modal -->
  <div *ngIf="isReviewModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" (click)="closeReviewModal()"></div>
    <div class="bg-surface-container-high border border-white/10 p-6 md:p-8 rounded-xl relative z-10 w-full max-w-md shadow-2xl flex flex-col items-center">
      <button (click)="closeReviewModal()" class="absolute top-4 right-4 text-on-surface-variant hover:text-white transition-colors">
        <span class="material-symbols-outlined">close</span>
      </button>
      
      <h3 class="font-headline-md text-2xl text-on-surface uppercase italic font-black mb-2 text-center">TÚ OPINIÓN <span class="text-gradient">IMPORTA</span></h3>
      <p class="text-on-surface-variant text-sm mb-8 text-center">Inicia sesión para dejar tu reseña oficial.</p>

      <!-- Step 1: Login -->
      <div *ngIf="!googleUser" class="flex flex-col items-center w-full">
        <div id="google-btn-container" class="mb-4 flex justify-center w-full h-[40px]"></div>
        
        <div class="w-full border-t border-white/10 my-4 relative">
          <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-surface-container-high px-2 text-xs text-on-surface-variant">O para probar</span>
        </div>
        <button (click)="simulateGoogleLogin()" class="text-xs text-primary-container hover:text-white underline">Simular inicio de sesión (Dev)</button>
      </div>

      <!-- Step 2: Review Form -->
      <div *ngIf="googleUser" class="w-full flex flex-col items-center animate-fade-in">
        <!-- Profile Info -->
        <div class="flex items-center gap-3 mb-6 bg-surface-container-low p-3 rounded-full border border-white/5 pr-6 self-start w-full">
          <img [src]="googleUser.picture" alt="" loading="lazy" class="w-10 h-10 rounded-full border-2 border-primary-container">
          <div class="text-left">
            <div class="text-[10px] text-on-surface-variant uppercase tracking-widest">Publicando como</div>
            <div class="font-label-bold text-sm text-white">{{ googleUser.name }}</div>
          </div>
        </div>

        <!-- Stars -->
        <div class="flex gap-2 mb-6">
          <button *ngFor="let star of stars" 
                  (mouseenter)="setHoverStar(star)" 
                  (mouseleave)="setHoverStar(0)"
                  (click)="setStar(star)"
                  class="transition-transform hover:scale-110 focus:outline-none bg-transparent border-none">
            <span class="material-symbols-outlined text-4xl"
                  [style.fontVariationSettings]="(hoveredStar >= star || selectedStar >= star) ? '\'FILL\' 1' : '\'FILL\' 0'"
                  [ngClass]="(hoveredStar >= star || selectedStar >= star) ? 'text-yellow-400' : 'text-on-surface-variant'">
              star
            </span>
          </button>
        </div>

        <!-- Text Area -->
        <textarea [(ngModel)]="reviewText" 
                  placeholder="Escribe tu experiencia aquí..." 
                  class="w-full bg-surface-container-low border border-white/10 rounded-lg p-4 text-white text-sm min-h-[120px] focus:outline-none focus:border-primary-container transition-colors mb-6 resize-none"></textarea>
        
        <!-- Submit Button -->
        <button (click)="sendReview()" 
                [disabled]="selectedStar === 0 || !reviewText.trim()"
                [ngClass]="{'opacity-50 cursor-not-allowed': selectedStar === 0 || !reviewText.trim()}"
                class="w-full py-4 bg-primary-container text-white font-label-bold text-xs uppercase tracking-[0.2em] hover:bg-white hover:text-black transition-all btn-premium">
          ENVIAR RESEÑA
        </button>
      </div>
      
    </div>
  </div>
</section>
