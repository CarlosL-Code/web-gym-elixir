<section class="py-xl px-margin-mobile md:px-margin-desktop bg-surface-container-lowest" id="gallery">
  <div class="max-w-7xl mx-auto">
    <div class="text-center mb-16">
      <h2 class="font-headline-xl text-4xl md:text-5xl text-on-surface uppercase italic font-black">NUESTRAS <span class="text-gradient">INSTALACIONES</span></h2>
      <p class="text-on-surface-variant uppercase tracking-[0.4em] font-label-bold text-[10px] mt-4">Conoce tu próximo lugar de entrenamiento</p>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-4 grid-rows-none md:grid-rows-2 gap-4 auto-rows-[250px]">
      <div *ngFor="let img of images" class="relative group overflow-hidden rounded-xl border border-white/5" [ngClass]="img.span">
        <img [src]="img.src" [alt]="img.alt" loading="lazy" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
          <span class="text-white font-label-bold text-sm uppercase tracking-widest border border-white/20 bg-black/50 backdrop-blur-md px-6 py-2 rounded-full">{{ img.alt }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
