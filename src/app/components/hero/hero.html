<header class="relative min-h-[85dvh] md:min-h-[100dvh] flex items-center justify-center overflow-hidden" id="home">
  <div class="absolute inset-0 z-0">
    <div class="absolute inset-0 bg-black/50 z-10 hero-gradient"></div>
    <div class="w-full h-full bg-cover bg-[center_top] md:bg-center transition-transform duration-[10s] hover:scale-110" style="background-image: url('/assets/images/imagen-personas-entrenando.jpg');"></div>
  </div>
  
  <div class="relative z-20 text-center px-margin-mobile md:px-margin-desktop max-w-5xl pb-24 lg:pb-0 pt-24 lg:pt-32">
    <div class="inline-flex items-center gap-2 mb-md py-2 px-5 bg-black/60 backdrop-blur-md border border-white/20 text-white font-label-bold text-[10px] uppercase tracking-[0.3em] rounded-full shadow-xl">
      <span class="material-symbols-outlined text-sm text-primary-container">location_on</span>
      MONTT #1027 (3ER PISO) • TEMUCO, CHILE <img src="https://flagcdn.com/w20/cl.png" srcset="https://flagcdn.com/w40/cl.png 2x" alt="Chile" class="inline-block w-4 h-auto align-text-bottom">
    </div>
    
    <app-masked-heading
      text="ELIXIR GYM"
      tag="h1"
      mediaType="image"
      src="/assets/images/personas-gym.jpg"
      [fillScale]="1.25"
      reveal="rise"
      [textScale]="0.2"
      customClass="font-display-lg-mobile md:font-display-lg mb-2 uppercase font-black text-white"
    ></app-masked-heading>
    
    <h2 class="text-xl md:text-3xl text-gradient italic uppercase font-black mb-8 tracking-widest">
      GIMNASIO EN TEMUCO, CHILE
    </h2>
    
    <p class="font-body-lg text-body-lg text-tertiary/80 mb-lg max-w-2xl mx-auto leading-relaxed">
      Experimenta el alto rendimiento en el corazón de Temuco. Un espacio diseñado para atletas reales que buscan resultados excepcionales.
    </p>
    
    <div class="flex flex-col md:flex-row gap-6 justify-center mb-xl">
      <a class="bg-primary-container text-white font-label-bold text-xs uppercase px-12 py-5 rounded-none tracking-[0.2em] btn-premium shadow-2xl shadow-primary-container/30 inline-block text-center" href="https://wa.me/56991832903?text=Hola%2C%20me%20gustar%C3%ADa%20solicitar%20una%20clase%20de%20prueba%20en%20Elixir%20Gym." target="_blank">
        PRUEBA GRATIS
      </a>
      <a href="#plans" class="border border-white/20 text-white font-label-bold text-xs uppercase px-12 py-5 rounded-none tracking-[0.2em] backdrop-blur-sm hover:bg-white hover:text-black transition-all text-center inline-block">
        VER PLANES
      </a>
    </div>
    

  </div>
</header>
