<header class="relative min-h-[90dvh] flex flex-col justify-center overflow-hidden" id="home">
  
  <!-- Slides Container -->
  <ng-container *ngFor="let slide of slides; let i = index">
    <div class="absolute inset-0 w-full h-full transition-opacity duration-1000 ease-in-out"
         [ngClass]="i === currentIndex ? 'opacity-100 z-10 pointer-events-auto' : 'opacity-0 z-0 pointer-events-none'">
      
      <!-- Fondo con efecto luminoso -->
      <div class="absolute inset-0 bg-[#0a0a0a]">
        <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-black/10 to-surface z-10"></div>
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_30%,rgba(0,0,0,0.6)_100%)] z-10 pointer-events-none"></div>
        <div class="w-full h-full bg-cover bg-[center_top] md:bg-center transition-transform duration-[15s] ease-out opacity-90" 
             [ngClass]="i === currentIndex ? 'scale-105' : 'scale-100'"
             [style.background-image]="'url(' + slide.bgImage + ')'"></div>
      </div>
      
      <!-- Contenido -->
      <div class="relative z-20 w-full h-full flex flex-col justify-center px-margin-mobile md:px-margin-desktop max-w-[1400px] mx-auto pt-16 sm:pt-24 lg:pt-32 pb-24"
           [ngClass]="{
             'items-start text-left': slide.layout === 'left',
             'items-end text-right': slide.layout === 'right',
             'items-center text-center': slide.layout === 'center'
           }">
        
        <div class="max-w-4xl flex flex-col"
             [ngClass]="{
               'items-start': slide.layout === 'left',
               'items-end': slide.layout === 'right',
               'items-center': slide.layout === 'center'
             }">
          <!-- Etiqueta -->
          <div class="inline-flex items-center gap-2 mb-8 py-2 px-6 bg-white/10 backdrop-blur-md border border-white/20 text-white font-label-bold text-[10px] uppercase tracking-[0.2em] md:tracking-[0.3em] rounded-full shadow-lg"
               [ngClass]="i === currentIndex ? 'animate-[fade-in-up_0.8s_ease-out_0.2s_both]' : 'opacity-0'">
            <i *ngIf="slide.tagIcon" class="bi {{ slide.tagIcon }} text-primary text-sm"></i>
            {{ slide.tagline }}
            <img *ngIf="slide.tagImage" [src]="slide.tagImage" alt="Badge" class="inline-block w-4 h-auto align-middle rounded-sm shadow-sm ml-1">
          </div>
          
          <!-- Título -->
          <h1 class="font-display-lg text-5xl md:text-6xl lg:text-[5rem] text-white leading-[1.1] uppercase font-black mb-8 w-full drop-shadow-2xl">
            <span class="block" [ngClass]="i === currentIndex ? 'animate-[fade-in-up_0.8s_ease-out_0.4s_both]' : 'opacity-0'">{{ slide.titleLine1 }}</span>
            <span class="block mt-2" [ngClass]="i === currentIndex ? 'animate-[fade-in-up_0.8s_ease-out_0.6s_both]' : 'opacity-0'">
              {{ slide.titleLine2 }} 
              <span *ngIf="slide.titleHighlight" class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-electric-blue pr-1">{{ slide.titleHighlight }}</span>
            </span>
          </h1>
          
          <!-- Subtítulo -->
          <p class="font-body-lg text-lg md:text-xl text-white/80 mb-12 max-w-2xl leading-relaxed drop-shadow-md"
             [ngClass]="i === currentIndex ? 'animate-[fade-in-up_0.8s_ease-out_0.8s_both]' : 'opacity-0'">
            {{ slide.subtitle }}
          </p>
          
          <!-- Botones de Acción -->
          <div class="flex flex-col sm:flex-row gap-6 w-full sm:w-auto"
               [ngClass]="i === currentIndex ? 'animate-[fade-in-up_0.8s_ease-out_1s_both]' : 'opacity-0'">
            <a class="relative group w-full sm:w-auto border-2 border-primary text-primary hover:text-black font-black text-xs uppercase px-12 py-5 rounded-2xl tracking-[0.2em] hover:-translate-y-1 transition-all duration-300 overflow-hidden text-center flex justify-center" 
               [href]="slide.btn1Link" target="_blank">
              <span class="relative z-10 flex items-center justify-center gap-2 transition-colors duration-300">
                {{ slide.btn1Text }}
                <i *ngIf="slide.btn1Icon" class="bi {{ slide.btn1Icon }} text-sm"></i>
              </span>
              <div class="absolute inset-0 bg-primary transform -translate-x-full group-hover:translate-x-0 transition-transform duration-300 ease-out"></div>
            </a>
            
            <a *ngIf="slide.btn2Text" [href]="slide.btn2Link" class="w-full sm:w-auto bg-white/5 backdrop-blur-md border border-white/20 text-white font-bold text-xs uppercase px-12 py-5 rounded-2xl tracking-[0.2em] hover:bg-white/10 hover:-translate-y-1 transition-all duration-300 shadow-xl flex items-center justify-center gap-2 text-center">
              {{ slide.btn2Text }}
              <i *ngIf="slide.btn2Icon" class="bi {{ slide.btn2Icon }} text-sm"></i>
            </a>
          </div>
        </div>
        
      </div>
    </div>
  </ng-container>

  <!-- Indicadores (Puntos) -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-30 flex gap-3">
    <button *ngFor="let slide of slides; let i = index" 
            (click)="goToSlide(i)"
            class="w-3 h-3 rounded-full transition-all duration-500 ease-out border border-white/50"
            [ngClass]="i === currentIndex ? 'w-10 bg-primary border-primary' : 'bg-white/20 hover:bg-white/60'"></button>
  </div>
</header>
